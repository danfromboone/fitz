plugins {
    id 'java-library'
    id 'groovy'
    id 'maven-publish'
}

group 'dfb'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    spockVersion = '2.5-groovy-6.0'
    lombokVersion = '1.18.48'
}

java {
    sourceCompatibility = '27'
    targetCompatibility = '27'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly("org.projectlombok:lombok:${lombokVersion}")
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")
    testCompileOnly("org.projectlombok:lombok:${lombokVersion}")
    testAnnotationProcessor("org.projectlombok:lombok:${lombokVersion}")

    implementation('org.apache.httpcomponents.client5:httpclient5:5.6.5')
    implementation('com.zaxxer:HikariCP:7.1.0')
// Source: https://mvnrepository.com/artifact/com.cronutils/cron-utils
    implementation("com.cronutils:cron-utils:9.2.1")

    api('org.slf4j:slf4j-api:2.0.20')
    testRuntimeOnly('ch.qos.logback:logback-classic:1.6.5')

    compileOnlyApi('jakarta.servlet:jakarta.servlet-api:6.1.0')
    testImplementation('jakarta.servlet:jakarta.servlet-api:6.1.0')
    testImplementation('com.h2database:h2:2.5.252')

    testImplementation("org.spockframework:spock-core:${spockVersion}")
    testRuntimeOnly('net.bytebuddy:byte-buddy:1.18.15')
    testRuntimeOnly('org.objenesis:objenesis:3.6')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

test {
    useJUnitPlatform()
}